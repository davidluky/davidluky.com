name = "davidluky-com"
compatibility_date = "2026-04-11"
main = "src/worker.ts"

routes = [
  { pattern = "davidluky.com", custom_domain = true },
  { pattern = "matheus.davidluky.com", custom_domain = true },
  { pattern = "manual-matheus.davidluky.com", custom_domain = true }
]

[vars]
EBAY_ENDPOINT_URL = "https://davidluky.com/ebay/deletion"
EBAY_ENVIRONMENT = "production"
# Bump this after rotating MATHEUS_PASSWORD: it is part of the signed session payload,
# so every cookie issued under the previous epoch stops verifying immediately.
MATHEUS_SESSION_EPOCH = "1"

# Brute-force brake on the Matheus gate password. namespace_id is a local identifier
# for this Worker's limiters; period must be 10 or 60 seconds.
[[ratelimits]]
name = "MATHEUS_LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# The password gate is hostname-aware, so every asset request must reach it.
run_worker_first = true
